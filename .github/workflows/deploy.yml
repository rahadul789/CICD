name: Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: rahadul789/cicd

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Docker build check
        run: docker build -t node-observability-deployment-lab:deploy-check .

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    env:
      APP_IMAGE: ghcr.io/rahadul789/cicd:${{ github.sha }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/node-observability-lab' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}

    steps:
      - name: Validate required secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "whoami && hostname"

      - name: Deploy image
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "APP_IMAGE='$APP_IMAGE' VPS_APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$VPS_APP_DIR"

          if [ -d .git ]; then
            git pull --ff-only origin main
          fi

          APP_INTERNAL_PORT="${APP_INTERNAL_PORT:-3001}"
          PROMETHEUS_HOST_PORT="${PROMETHEUS_HOST_PORT:-9090}"
          GRAFANA_HOST_PORT="${GRAFANA_HOST_PORT:-3002}"
          LOKI_HOST_PORT="${LOKI_HOST_PORT:-3100}"

          docker rm -f node-observability-app 2>/dev/null || true

          export APP_IMAGE APP_INTERNAL_PORT PROMETHEUS_HOST_PORT GRAFANA_HOST_PORT LOKI_HOST_PORT

          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d
          docker image prune -f

          wait_for_url() {
            service_name="$1"
            url="$2"

            for attempt in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$service_name is ready"
                return 0
              fi

              echo "Waiting for $service_name ($attempt/30)"
              sleep 2
            done

            echo "$service_name did not become ready"
            return 1
          }

          wait_for_url app "http://127.0.0.1:${APP_INTERNAL_PORT}/health/ready"
          wait_for_url prometheus "http://127.0.0.1:${PROMETHEUS_HOST_PORT}/-/ready"
          wait_for_url grafana "http://127.0.0.1:${GRAFANA_HOST_PORT}/api/health"
          wait_for_url loki "http://127.0.0.1:${LOKI_HOST_PORT}/ready"
          REMOTE
